# 她給你的卡(docs/design/v5-play.md §2、cards.md):每日卡用魚幣買,每天第一張也要錢;部件照公開的機率抽,
# 表情由你們的關係決定,買不到也抽不到。卡不能交易、不能送。卡框和閃卡在 [modules.economy](frames、card_foil)。
# 舊的「抽收藏」拿掉了,已經有的收藏留在圖鑑的「舊收藏」。下面都是預設值。
# 不用錢的卡(不必設定):羈絆升到沒到過的分級時一張里程碑卡(每一級一張,最多 15 張);
# 從舊紀錄搬過來的人第一次看自己的卡時一張紀念卡。都不算進每天的張數,也不動保底。
# [modules.cards]
# enabled = true
# price = 30                  # 一張每日卡多少魚幣
# daily_cap = 5               # 一個人一天最多幾張(她的當地日)
# pity = 20                   # 連續幾張沒有 SR 以上的部件,下一張保證有
# rarity_weights = { N = 70, R = 22, SR = 7, SSR = 1 }   # 稀有度的權重(公開的機率表照這個算)
# utc_offset_minutes = 480    # 「今天」從哪個時區的午夜開始算
# # 卡上的立繪(docs/design/cards.md §6):live2d = 照抽到的部件和表情用她的 Live2D 模型現場算圖,
# # 算不出來(沒設模型、card-studio 沒建置、沒有 Edge / Chrome)就用 10 張固定立繪;fixed = 一律用固定立繪
# portrait = "live2d"
# portrait_model = "C:/Program Files (x86)/Steam/steamapps/common/VTube Studio/VTube Studio_Data/StreamingAssets/Live2DModels/DeepSeek-chan/大肥鱼.model3.json"   # 沒設 = 用固定立繪
# portrait_studio = "tools/card-studio"        # card-studio 的資料夾(照它的 vendor.md 放好 Live2D 的檔案再 build)
# portrait_cache = "data/cards/portraits"     # 算好的圖,依「抽到什麼」的雜湊存,同一張卡只算一次
# portrait_cache_max_mb = 2048                # 算好的圖最多佔多少 MB(一張約 1 MB);超過就刪最久沒用到的,要用時再算
# portrait_browser = "msedge"                 # 無頭瀏覽器:msedge 或 chrome
# portrait_timeout_secs = 30                  # 一張圖最多等多久
# # 頻道裡的掉落(v5-play.md §6.2):頻道熱鬧時她偶爾丟一張卡,第一個按「撿起來」的人拿走(免費,帶一個只有掉落才有的部件)
# drops = false               # 預設關;開了也只在 drop_channels 列的頻道
# drop_channels = []          # 要掉落的頻道 id,例如 ["123456789012345678"]
# drop_window_mins = 10       # 熱鬧 = 這幾分鐘內
# drop_min_people = 3         #   至少這麼多人
# drop_min_lines = 20         #   一共說了這麼多句(她自己、機器人的不算)
# drop_chance = 0.25          # 熱鬧時掉一張的機率,一段時間只擲一次
# drops_per_channel_day = 2   # 一個頻道一天最多幾次
# drop_gap_mins = 120         # 同一個頻道兩次之間至少隔多久
# drop_delay_min_secs = 30    # 決定要掉之後隨機等一下才出現,不能算準
# drop_delay_max_secs = 180
# drop_expire_mins = 10       # 沒人撿就飄走
# drops_per_person_day = 1    # 一個人一天最多撿幾張;上一張是你撿的,同一個頻道的下一張你撿不到

# 每週的市集(docs/design/v5-play.md §4.5、§11.4):點歌優先券、每週拍賣、每週樂透。下面都是預設值。
# 魚幣都走經濟的帳本;得標的錢、用掉的優先券和三成的樂透會燒掉。她自己不能出價、買券或中獎。
# [modules.market]
# enabled = true
# utc_offset_minutes = 480    # 「今天」「這週」從哪個時區算
# # ---- 點歌優先券:/queue song request 加 priority(會員頁點歌也能勾),排到沒用券的歌前面;用券的照先後
# song_priority = 40          # 一張多少魚幣;歌沒準備成功或被取消就退回
# song_priority_per_day = 2   # 一個人一天最多幾張(0 = 不賣)
# # ---- 每週拍賣:一週一件,在 auction_channel 公開出價(按鈕加表單),出價先押住,被超過就馬上退回
# auction = true              # false = 不開新的;正在拍的取消,押著的全退
# auction_channel = ""        # 拍賣的頻道 id;留空 = 不辦拍賣
# auction_weekday = 6         # 星期幾開(0 = 星期日 … 6 = 星期六)
# auction_time = "20:00"      # 幾點開(她的時間)
# auction_hours = 24          # 開多久
# auction_opening_bid = 50    # 起標
# auction_step = 5            # 每次至少加多少
# auction_extend_mins = 5     # 最後幾分鐘有人出價就延長這麼久(0 = 不延長)
# auction_extend_max_mins = 30   # 延長最多到原本結束後幾分鐘(0 = 不延長)
# auction_lots = ["frame"]    # 拍什麼:只此一件的卡框;加 "call_name"(這一週她怎麼叫你)才會拍稱呼。不只一種時她挑,沒有模型就輪流
# auction_call_days = 7       # 得標的稱呼用幾天,之後換回原本的
# auction_name_hours = 72     # 得標的人幾小時內要給一個她接受的稱呼,不然退款
# auction_purpose = "market"  # 她挑拍品用的模型([llm.purposes];沒設 = 聊天那一組)
# # ---- 每週樂透:依張數抽一個人;少於 lottery_min_buyers 個人買就不開獎、全額退回
# lottery = true              # false = 不賣;這週已經賣的全額退回
# lottery_channel = ""        # 每週公告和開獎發在哪;留空 = 拍賣的頻道(兩個都空就不公告)
# lottery_price = 10          # 一張多少魚幣
# lottery_per_week = 20       # 一個人一週最多幾張
# lottery_prize_share = 0.7   # 獎金是賣出的這個比例,其餘燒掉
# lottery_weekday = 0         # 星期幾開獎(0 = 星期日)
# lottery_time = "20:00"
# lottery_min_buyers = 3      # 至少幾個不同的人買才開獎

# 唱 K 第一步(docs/design/karaoke.md「做了什麼(第一步)」):會員頁一個人唱。貼連結或打歌名,
# 唱歌 worker 做伴唱軌和參考旋律;在自己的瀏覽器唱、算音高,唱完 Core 用同一份評分重算,
# 她在講評頻道講一句。麥克風的聲音不離開瀏覽器,只送每秒 50 格的音高軌(留 7 天)。沒有魚幣。
# [modules.karaoke]
# enabled = true
# utc_offset_minutes = 480    # 「今天」從哪個時區算(每人每天的上限)
# open = true                 # false = 會員不能點歌、唱、開房間;唱完的結果照常;面板管理員關著時也能用,可以先試
# max_song_secs = 480         # 一首最長幾秒,超過的準備失敗
# daily_songs = 10            # 每人每天能準備幾首新歌;已經準備好的歌不算(0 = 只能唱準備好的)
# tolerance_cents = 50        # 離原唱幾 cents 內算唱對,兩倍遠就不算
# voice_score = true          # 唱的時候錄下麥克風,唱完送唱歌 worker 讀音高算正式分數,算完兩邊都刪;false = 只有預估分數
# comment = true              # 唱完讓她講評(她平常的一個回合,沒有另外的模型呼叫)
# comment_channel = ""        # 講評的文字頻道,"discord:<伺服器 id>:<頻道 id>";留空 = 她只知道、不開口
# voice_wait_secs = 90        # 講評最多等正式分數幾秒,等不到就用預估分數
# video = true                # 背景影片:準備歌時留一份來源的畫面(最高 720p、沒有聲音),唱的時候放在歌詞後面
# video_keep_hours = 24       # 影片在 Core 上最後一次唱過後留幾小時,再唱時從 worker 再拿
# cache_dir = "data/karaoke"  # 伴唱軌和參考旋律在 Core 上放哪(相對 miyoria.toml);一天沒人唱就刪
# 多人房間:她在語音頻道時,會員在會員頁開房間、用房號加入,大家同時唱同一首(房間開在講評頻道的伺服器)
# rooms = true                # false = 不能開房間
# room_price = 20             # 開房費(燒掉);一首都沒唱完就關掉的房間全退;0 = 免費
# room_prize = 15             # 每一首的第一名:至少兩個人唱完、要是正式分數、沒有被標記;同分都給
# room_finish = 3             # 唱完一首的人各拿這麼多
# room_finish_share = 0.5     # 原唱有聲的地方唱到這麼多(而且音比亂唱準)才算唱完
# room_prizes_per_day = 2     # 每人每天第一名獎勵最多幾次
# room_finishes_per_day = 5   # 每人每天唱完獎勵最多幾次
# room_rounds = 4             # 一間房最多唱幾首(開房費只收一次)
# room_singers = 8            # 一間房最多幾個人唱(旁觀不算)
# room_max = 2                # 同時最多幾間房
# room_idle_mins = 10         # 房間閒置多久(沒有開始唱)就關掉
# room_countdown_secs = 6     # 按開始後倒數幾秒,大家的伴奏同時開始
# room_stream = true          # 唱的時候把麥克風即時送到唱歌 worker 算正式分數(不存);false = 唱的時候只有預估,唱完送錄音
# 直播(第五步):她的直播(Go Live,OBS 的唱 K 場景)播伴奏和最多一個人的歌聲;她自己的語音頻道不播。
# overlay 的瀏覽器來源要「讓 OBS 控制音訊」(stage obs-setup 會設好),聲音才進得了直播
# stream_scene = true         # 直播畫面顯示唱 K 房間:等人時角落一塊,唱的時候歌詞、背景影片、即時排名、結果
# stream_backing = true       # 直播的唱 K 場景播伴奏
# stream_delay_ms = 2000      # 直播比唱的人晚多少(一間房固定一個);播出的歌聲太晚到的那一段是靜音,不會越拖越晚
# relay_solo = true           # 一個人唱時可以播出他的歌聲(他自己勾「讓大家聽到我」,每一首預設不勾;聲音不存)
# relay_lead = false          # 新房間預設「播出第一名的歌聲」(兩個人以上唱時一次播一個人;開房的人可以改,每人可以選不要播)
# relay_hold_secs = 4         # 新的第一名要連續領先幾秒才換成他的聲音(盡量換在兩句中間)
# relay_fade_ms = 200         # 換人時淡入淡出多久
# stream_backing_gain = 0.8   # 直播伴奏的音量(0–1)
# stream_voice_gain = 1.5     # 直播歌聲的音量(0–4)
# stream_duck_gain = 0.35     # 她在語音頻道講話時,直播的唱 K 聲音降到這個比例
# 歌詞:唱歌 worker 把查到的歌詞一行一行和主唱聽到的比對,對上的逐字對齊、照字切音符;
# 查不到或對不上就用聽寫的。下面只影響之後準備的歌
# aligner = "mms"             # mms(預設;難的歌準很多,權重 CC-BY-NC-4.0,只能非商業使用)| w2v(Apache-2.0;有收入的用途請用這個)
# lyrics_matched = 0.75       # 一行和聽到的至少這麼像才算對上
# lyrics_uncertain = 0.5      # 比這個低算對不上
# lyrics_keep_share = 0.5     # 對上的行至少這麼多,整首就用查到的歌詞
# lyrics_wrong_share = 0.2    # 對上的行比這個少 = 查錯歌,改用聽寫

# 遊戲內聊天變成獨立的對話(每個世界 / 伺服器一段歷史)。玩家在 Discord 用 /me link 拿代碼,
# 在遊戲聊天室打 `!link <代碼>` 就跟 Discord 帳號連在一起;沒連的玩家是陌生人。
# 她在遊戲裡的回話很短、不會下指令;直播中又在語音裡時也用語音說(她可以用 game_chat_reply 自己改)
[modules."game.chat"]
# games = ["minecraft"]
# world = "local"            # 這個世界 / 伺服器的名字(對話情境的 scope;頻道模式可用 "minecraft:local")
# username = ""              # 她在遊戲裡的名字(別人提到時才知道是在叫她)
# max_chars = 120            # 她在遊戲聊天室一句最多幾個字
# reply = "auto"             # auto | chat | voice | both

[modules.voice]
consent = "opt-out"        # opt-out:預設收音,可用 /voice consent off 退出;opt-in:同意後才收
barge_in = "selective"     # 有人插話時:selective(只有這回合要回的人 / 叫她名字 / 對她說實質內容才停,其他人只降音量)| stop(任何人都停)| ignore
# barge_in_ms = 600            # 這回合要回的人講多久先暫停她(stop 模式:任何人講多久就停)
# barge_in_duck_ms = 250       # 其他人講多久她就降音量
# barge_in_duck_gain = 0.3     # 降音量時剩多少(0~1)
# barge_in_focus_stop_ms = 3000 # 要回的人一直講到這麼久,不等語音辨識就停
# names = ["她的名字", "暱稱"]    # 叫到這些字就停(profile 的名字模組會自己補上)
# music_gate = true            # 唱歌時只有叫她名字的句子算有人講話
# self_echo_tail_ms = 5000     # 她講完後這段時間內,轉錄跟她說的話重複就當回音
# 判斷講完(workers/turn,見 workers/README.md 第 10 節)。模型沒裝、worker 沒開或答得太慢,都會退回舊行為
# turn_engine = "silence"      # silence:安靜 end_silence_ms 或 voice node 關掉串流就算講完 | smart-turn:Smart Turn 判斷
# # turn_url 只在 turn 服務沒有 hostd 管時才寫;hostd 管的不用寫
# turn_url = "http://127.0.0.1:8006"   # end-of-turn worker(Smart Turn 和 Silero 都在這裡)
# turn_stop_ms = 200           # 安靜多久問一次模型
# turn_timeout_ms = 150        # 模型這麼久沒答就當沒問,回到 end_silence_ms
# turn_max_silence_ms = 1500   # 模型說還沒講完時,最多等這麼久
# turn_confirm_ms = 400        # 回合結束後對方再安靜這麼久,她的回覆才開始合成(LLM 先跑)
# turn_gate_max_ms = 2000      # 她的回覆為了這件事最多等這麼久
# turn_early_asr = false       # 模型說還沒講完時先辨識一次,真的講完就省下 ASR 時間;每次停頓多跑一次 ASR
# vad_engine = "energy"        # energy | silero(Silero 在 turn_url 的 worker 跑,連不上就退回 energy)
# vad_silero_threshold = 0.5   # Silero 判定是語音的機率
# ASR 常聽錯的字改回來,在任何人讀到轉錄之前做(聽不到名字就等於沒叫她)。拉丁字母整個字比對、不分大小寫
# asr_aliases = { "咪o" = "Miyo", "meo" = "Miyo", "deep sick" = "DeepSeek" }
# asr_while_paused = false     # 做歌佔顯示卡時仍送 ASR(asr_chain 裡有 CPU 的 worker 才有用)
# clip_dir = "data/voice-clips" # 留下同意收音者的片段,用來比較 ASR、校準 Smart Turn。成員的聲音會落地,預設關閉
# tts_prefetch = 2             # 她說話時先合成後面幾句(0 = 關閉)
# tts_prefetch_ttl_ms = 30000  # 預先合成的句子沒人用,過這麼久就丟掉
# sentence_pause_ms = 0        # 同一次回話的兩句之間停多久(毫秒,最多 3000);0 = 不停,上一句一播完下一句就接著
# speech_hold_max_ms = 90000   # 唱歌 / 顯示卡借出時她的話最多等這麼久,再久就丟掉
# 說話用另一種語言(例如日文聲線比較好聽):每句先用 LLM(fast)翻譯再送 TTS,字幕和聊天紀錄維持原文
# tts_translate = "Japanese"
# Discord Go Live:voice node 的 ffmpeg 在這裡等 OBS 推流(對應 OBS 的伺服器 + 金鑰)。
# 預設 = OBS 伺服器 rtmp://127.0.0.1:1935/live、金鑰 miyoria。`/voice golive start` 會用它
# (她還不在語音裡時,會先進你所在的語音頻道)。
# golive_source = "rtmp://127.0.0.1:1935/live/miyoria"
# golive_listen = true         # true = voice node 的 ffmpeg 自己當 RTMP 伺服器等 OBS 推流;
#                              # false = OBS 推到 MediaMTX(workers/mediamtx/,佔 :1935),ffmpeg 去那裡拉。
#                              # 網站要看直播畫面就用 false,搭配 [modules.activity] obs_hub = true;
#                              # OBS 的設定不用改,一樣是 rtmp://127.0.0.1:1935/live、金鑰 miyoria
# 墊話(v4 §7.5):有人叫她、而她還沒有任何聲音時,先放一小段預先合成好的她自己的聲音(「嗯?」「欸~」),
# 不然對方會聽到一段沉默。只在她被叫到時;她決定不說話的回合、或第一句寫好時就不放。
# 不是一句台詞(不進她的對話紀錄,也不算 Floor 的額度);連兩次不會是同一個。預設開著,不要就 filler = false
# filler = true
# filler_after_ms = 600          # 回合開始後多久還沒有她的聲音就放墊話(模型寫出第一句通常比這更久)
# filler_lines = { Chinese = ["嗯?", "欸~", "蛤?", "等等"], Japanese = ["ん?", "え~", "え?", "えっと"] }
#                                # 依她被聽到的語言(tts_translate,沒設就 tts_language)挑;沒列的語言就沒有墊話。
#                                # 要短而中性,放在任何回答前面都不奇怪;每個聲線只合成一次,存在 filler_dir
# filler_dir = "data/voice/fillers"   # 合成好的墊話放哪(一個聲線一個資料夾)
# filler_max_ms = 1500           # 合成出來比這更長的墊話不用

# 她的行動閘門:進語音、開台、換場景、玩遊戲、私訊……不論誰要求都要過這裡(紀錄在稽核紀錄)。
# 緊急暫停用 /admin autonomy pause;每個人可以用 /me privacy 拒絕私訊或被主動找
[modules.actions]
# paused = false                 # 一開機就是緊急停止狀態(之後以 /admin autonomy resume 的選擇為準)
# emergency_step_ms = 20000      # 緊急停止每一步最多等多久,逾時就算失敗、接著做下一步
# forbidden = ["message.dm"]     # 完全禁止的能力(也可以 "stream.*")
# dm_strangers = false           # 不私訊不熟的人(熟悉度低於 stranger_familiarity)
# [modules.actions.medium]       # 中風險動作的次數上限(她自己決定或聊天請求時;指令不受限)
# per_day = 30
# per_person_per_day = 8
# cooldown_ms = 20000
# inline_wait_ms = 8000          # 高風險工具(跑程式等)等審核多久;來不及就晚點在後續回合告訴她結果
# [modules.actions.limits."code.run"]
# per_day = 50
# cooldown_ms = 5000
# [modules.actions.share]        # 她把自己做的檔案當附件傳給開口要的人(這個階段沒有連結)
# max_bytes = 10485760           # 一個檔案最多幾 bytes(平台自己的上限另外算,取小的)
# per_day = 60                   # 每 24 小時最多傳幾個(所有人加起來)
# per_person_per_day = 10        # 每 24 小時最多傳給同一個人幾個

[modules.directive]
# 主人規則(docs/design/v3-architecture.md §9)。規則本身存在資料庫裡,用對話、/miyo、/admin i 或面板管理,
# 這裡只設定主人以外的人能做到什麼程度。關掉這個模組只會少了工具和指令,已經有的規則照樣生效。
# viewer_ttl_mins = 10       # 觀眾的要求只是偏好,維持幾分鐘(不管對方怎麼說)
# moderator_max_mins = 1440  # 管理員的規則最長幾分鐘(超過會縮短;管理員一定要給時效)
# max_viewer_wishes = 5      # 同時最多留幾個觀眾的要求(一人一個)
# refresh_secs = 30          # 多久重讀一次規則;讀不到時她的動作全部擋下(停止類動作除外)
# history_days = 30          # 結束的規則在面板留幾天

# 她在做什麼(ActivityManager):語音、直播、活動(遊戲 / 唱歌)只有這一個主人。她的工具、指令、
# 面板、導演都經過它:重複的要求不會重做、同一件事一次只做一個;工具立刻回「開始了,task …」,
# 做好或失敗(含原因,例如「開台失敗:OBS 沒開」)再通知她。開台 = Go Live + OBS 兩步;離開語音前先關台,
# 等她把話講完才離開。
[modules.activity]
# golive_timeout_ms = 60000      # Go Live 多久沒開始就算失敗
# obs = true                     # 連著直播機時 OBS 是開台的第二步(過閘門);false = 只有 Go Live
# obs_start_delay_ms = 3000      # Go Live 開了之後等多久才按 OBS 開始直播(obs_hub:OBS 開播後等多久才開 Go Live)
# obs_attempts = 3
# obs_hub = false                # true = OBS 推到 MediaMTX(workers/mediamtx/),網站自己看得到,跟 Go Live 脫鉤:
#                                # 開台先開 OBS 再開 Go Live;關台、離開語音、Go Live 斷掉都不會停 OBS。
#                                # 要搭配 [modules.voice] golive_listen = false;OBS 一樣推 rtmp://127.0.0.1:1935/live、金鑰 miyoria
# voice_timeout_ms = 20000       # 進 / 離開語音等確認的時間
# speech_wait_ms = 30000         # 離開語音前最多等她把那一輪話講完多久
# game_timeout_ms = 300000       # 遊戲最多開多久(含啟動器與載入世界)
# failed_hold_ms = 120000        # 失敗的活動(例如遊戲斷線)留著給大家看多久
# restore_grace_ms = 180000      # 重啟後上次沒關的遊戲最多等多久連回來,等不到就當已經關了
# restore_poll_ms = 5000         # 重啟後多久看一次那個遊戲回來了沒
# notice_ttl_ms = 600000         # 通知多久後就不用再告訴她

[modules.agent]
# 文字頻道的聊天等級:off(關閉)| mention-only(只回提及)| quiet(安靜)| normal(一般)| lively(活躍)
# (always = 每則都回,測試用)。等級是上限:她在等級之內自己決定要多話,
# 有人請她安靜點她也會自己調。沒設定的頻道用 profile 的 default_channel_mode(預設 quiet)。
# 也可以在 Discord 用 /channel mode 或面板「內心 → 世界」即時切換
# default_mode = "quiet"
# channels = { "<channel id>" = "lively", "discord:<guild id>" = "mention-only" }
# 她寫 @名字 會變成真的 tag
# mention_users = true
# 回合:最後一則訊息後等多久才開始回(打字中會延長);回覆會引用叫她的那則訊息
# debounce_ms = 800
# reply_reference = true

# 語音聊天。也可以用 /voice mode 即時切換。要不要插話 = 她的多話程度(心智迴圈或「活躍點」)
# × 佔比上限;有人還在講話時她不插嘴。她自己多久開一次口由 [modules.arbiter] 決定
# 主線 prompt 的字數預算(v4 §4.1)。prompt 沒有 token 上限,各部分各有字數預算。
# 對話紀錄放在快取前綴裡,所以放得長也不貴。下面都是預設值
# [modules.agent.mainline]
# self_chars = 1600              # 「現在」裡她自己的狀態
# data_chars = 12000             # 參考資料(世界、遊戲、筆記)合計
# memory_lines = 20              # 每回合帶進來的記憶最多幾則(0 = 照 [modules.memory] 的 recall_limit)
# examples_chars = 4000          # 範例對話(0 = 不放);每個 session 輪替一批,同一個 session 內不變,前綴才不會變
# memory_recent_lines = 4        # 檢索除了她回的那句,也看它前面幾句(「好啊」本身什麼都找不到)
# people_chars = 3600            # 在場的人的檔案(放在對話紀錄前面)
# life_chars = 800               # 「今天的她」(她做過的事),放在對話紀錄前面
# skills_chars = 800             # 她的技能索引(一個名字加一行)
# notebook_chars = 600           # 筆記本索引
# emoji_chars = 1200             # Discord 伺服器自訂表情和意思的清單(表變了才會變,放在對話紀錄前面)
# just_now_chars = 1200          # 「剛才」她在每個地方做了什麼(放在對話紀錄後面)
# elsewhere_chars = 900          # 她在的其他地方在聊什麼
# context_entries = 4            # 資料區塊裡不可信的工作脈絡最多幾則
# commitment_due_secs = 120      # 她說要做但沒說期限時,多久算逾期
# commitment_sweep_ms = 5000     # 多久找一次逾期的承諾
# ms_per_char = 180              # 講一個字要多久(被打斷時推算她講到哪)

# 工作線(v4 §4.3):現在只給遊戲導演一步一步做決定用(它的紀錄、每天的 token 額度、它記住的技能);
# 她自己好幾步的事交給小幫手(下面的 delegate)。下面都是預設值
# [modules.agent.work]
# enabled = true
# daily_tokens = 600000          # 所有任務一天(UTC)加起來最多花多少 token,遊戲導演的步驟也算在內;用完就不再啟動
# result_chars = 1200            # 她的結論,主線被告知的字數
# did_lines = 6                  # 「做了什麼」告訴主線幾行
# keep_ended = 20                # 結束的任務留幾個給 work_list 和面板

# 小幫手:她用 delegate 交代出去的工作(research 上網查、curator 整理筆記本)。
# 語音頻道裡也可以交代,結果回到她還在的那個語音頻道。
# 小幫手不會講話、不花錢、不寫工作區;結果回到交代的那個地方叫她。額度都在這裡,和她自己的額度分開記
# [modules.agent.delegate]
# enabled = true
# max_running = 2                # 同時跑幾個(1 到 4);多的排隊
# max_queued = 4                 # 最多排幾個,更多的 delegate 被拒絕(她會知道)
# daily_usd = 3                  # 所有小幫手一天(以一天的開始算)加起來最多花多少美元,依模型價目表;用完就不再開
# daily_tokens = 9000000         # 模型沒有價目時改用 token 算的一天上限
# reflect_daily_usd = 0.5        # 每晚的反思一天最多花多少美元,另外記
# reflect_daily_tokens = 1500000 # 反思在模型沒有價目時的 token 上限
# result_chars = 1500            # 結果叫醒她時放進去的字數;更長的用 delegate_read 讀
# read_chars = 8000              # delegate_read 一次給她的字數
# keep_ended = 20                # 結束的工作留幾個給 delegate_list 和面板

# 輸出檢查:新跑者留下的六個對她輸出的檢查(編號見 docs/design/v5-brain.md Q8)。預設都開;
# 這些開關是除錯用的,關掉一個只是拿掉那一個檢查,外層的牆(主人規則、行動閘門、送達帳本、輸出審查、
# Floor 的限額)不受影響
# [modules.agent.corrections]
# leak_screen = true             # #9 回覆審查(文字):整段是她的推理內容就丟掉,不送出
# leak_screen_spoken = true      # #10 語音逐句:是她推理內容的句子不念
# thinking_block = true          # #11 <emo:thinking>…</emo:thinking> 之間的字是推理,不給人看
# fallback_line = true           # #15 模型失敗或什麼都沒給、而有人在等時,送固定的一句短話
# tag_strip = true               # #18 拿掉寫成標籤的工具、DeepSeek 的工具標記和 HTML 標籤
# self_talk = true               # #19 她寫給自己的盤算(「他在問我…,直接回他就好。」)只拿掉那一行,文字不送、語音不念

# 節奏:文字頻道裡她怎麼分幾則送、表情反應的上限(v4 §7.2、§7.3)。這一節在 [modules.agent.rhythm]
# (不是 [modules.agent.mainline]),下面都是預設值
# [modules.agent.rhythm]
# reactions_per_hour = 20        # 每個頻道每小時最多幾個表情反應(不是台詞,不算 Floor 額度);0 = 不反應
# reaction_gap_ms = 3000         # 同一個頻道兩次反應至少隔多久
# pace_ms_per_char = 40          # 一次回覆分成幾則短訊息時,依下一則的長度隔開並顯示輸入中:每字這麼久
# pace_min_ms = 300              # 但最短
# pace_max_ms = 1800             # 最長

# 她自己起頭的事:她設的時間到了、外面發生的事、該追問的事、答應過
# 還沒做的事、這裡安靜了、想念某人、早上醒來,都先過程式的關卡,過了才叫醒她,說不說由她決定。
# 每天幾次、每個地方幾次、每個人幾次、間隔、沒人回時拉長的間隔、安靜時段都照 [modules.arbiter];
# 早上幾點照 [modules.mind] 的 daily_hour,「在意的人」照 [modules.heart];面板的暫停也停這些。
# 下面是新的設定,都是預設值
# [modules.agent.initiative]
# home = "<channel id>"          # 不屬於哪個地方的事(早上、沒指定地方的提醒)在哪裡叫她;不設 = 等她下次在任何地方醒來時看
# glances_per_day = 120          # 所有頻道加起來一天最多「看一眼」幾次
# quiet_mins = 10                # 一個地方多久沒人說話算安靜了
# longing_min = 0.5              # 想念到多少(0 到 1)才會想私訊對方
# mood_weight = 0.5              # 她的心情對自己起頭影響多大:想主動時安靜不用等那麼久、想念的門檻低一點(0 = 不影響)
# row_window_mins = 60           # 「不連續兩次同一種事」往回看多久
# tick_secs = 30                 # 多久看一次到期的時間、追問和承諾
# inbox_items = 12               # 一個回合最多給她看幾件收件匣的事
# schedules_max = 20             # 她設的時間(含 remind_me)最多幾個
# schedules_per_person = 3       # 一個人最多請她設幾個提醒
# schedule_max_days = 30         # 最遠設到幾天後
# [modules.agent.initiative.cooldown_mins]
# world = 30                     # 兩次「外面發生的事」至少隔多久
# quiet = 60                     # 兩次「這裡安靜了」至少隔多久
# longing = 240                  # 兩次「想念某人」至少隔多久
[modules.agent.voice]
default_mode = "normal"    # off | mention-only | normal | always(語音沒有安靜 / 活躍之分)
debounce_ms = 700          # 對方講完後等多久(看他是不是還要繼續講)
text_chat = true           # 她在語音頻道裡時,那個頻道文字區打的字她也用說的回
text_aside = true          # 用說的回時,網址和程式碼改貼到語音頻道的文字區
# text_echo = false        # true = 她用說的回完之後,把說的話(她寫的原文;tts_translate 讓她講別的語言時是中文)也貼到語音頻道的文字區
keep_in_voice = true       # 她在語音時,自己的事(做事的結果、遊戲實況)用說的,不發到文字頻道;回別人的話還是留在原處
direct_debounce_ms = 400   # 有人叫她(名字、她剛講完就問她)時只等這麼久
# turn_debounce_ms = 100   # Smart Turn 判定講完時只等這麼久(turn_engine = "smart-turn" 才會用到)
# debounce_from_speech_end = true  # 上面的等待從對方最後一個聲音算起,不是從轉錄送到才算(語音節點的靜音偵測和 ASR 本來就等了約一秒);false = 從轉錄算
# speculate = true         # 有人叫她、等待還沒結束時,回合先開始跑(記憶、prompt、模型),等待結束前不說也不做任何事;對方接著講就丟掉重來(次數在 agent_voice_speculation_total)
# speculate_max_per_min = 4  # 每個語音頻道每分鐘最多丟掉幾次提早開始,超過就照舊等
# warm_context = true      # 語音回合 prompt 中不依賴她回的那句的部分,每個頻道先備好、不用等,背景再更新給下一回合
# warm_contributors = ["notebook", "just_now", "elsewhere"]   # 先備好的段落:最多是上一回合的內容
# warm_max_age_ms = 120000 # 備好的內容超過這麼久就不用
# live_context_ms = 400    # 依她回的那句才有的部分(記憶檢索等)在語音最多等這麼久,逾時就不放(文字等 contributor_timeout_ms)
# 下面是她回話的細節,都是預設值
# max_debounce_ms = 2500   # 一個回合的等待上限(有人還在講會延長,但不超過)
# question_window_ms = 8000  # 她講完後這麼久內有人問問題,算是在問她
# speak_ttl_ms = 30000     # 句子這麼久還沒開始播就丟掉

# 她沒親眼看到的上下文:重開後(或很久沒人講話後)補抓頻道之前的訊息、回覆鏈。
# 需要 Bot 的「讀取訊息歷史」權限;抓不到就用自己的訊息紀錄
[modules.agent.history]
backfill = 20              # 冷啟動補抓幾則(0 = 不補抓)
reply_chain = 3            # 回覆的訊息不在紀錄裡時,最多往上抓幾則
timeout_ms = 3000          # 最多等多久,逾時就不等了直接回

# 看圖(聊天模型要收圖片,見 [llm.image_input]):她回的訊息、它回覆的訊息、
# 同一個人兩分鐘內傳的圖
[modules.agent.vision]
enabled = true
max_images = 3             # 每回合最多幾張
max_image_bytes = 5000000  # 單張上限
# detail = "auto"          # auto | low | high(low 最便宜)
# 連結預覽的圖也算那則訊息的圖,只拿 Discord 自己代理的那份,不會連到第三方網站
# allowed_hosts = ["cdn.discordapp.com", "media.discordapp.net", "images-ext-1.discordapp.net", "images-ext-2.discordapp.net"]

# 別人傳來的檔案(文字、程式碼、markdown、csv、json、pdf、docx、xlsx、pptx):在沙箱裡開、
# 當資料給她看,見 docs/design/file-attachments.md。要有 tools.file(member 以上預設有)。
# 沙箱沒開或 Docker 不能用時,她只會說現在沒辦法安全地打開檔案,不會在沙箱外處理。
[modules.agent.files]
enabled = true
max_files = 2              # 每回合最多讀幾個檔案

# prompt 編譯器:每一段參考資料有自己的字數上限(超過就留整行、標「還有幾行略過」),
# 其他模組附上的段落加起來不超過 [modules.agent.mainline] data_chars(超過時公平分配,不是後面的直接被砍)
[modules.agent.prompt]
default_budget = 600       # 沒列在 budgets 的段落
self_chars = 2000          # 她寫給自己的那份文件放進固定區塊的字數上限(不受 budgets 限制)
# mood_style = true        # 依她的心情,在 style_note 加一句回長回短、要不要用表情回應(程式不硬切)
save_every = 1            # 每幾個回合存一份壓縮過的實際 prompt(面板看;0 = 不存)
# budgets = { conversation = 900, memory = 1000, knowledge = 700, lessons = 500, world = 500, game = 700, sing = 400, people = 800, examples = 2500 }

# 她的感知:誰在線、在玩什麼、誰在哪個語音頻道、各頻道熱不熱鬧。
# 每個人都能用 /me privacy presence:off 不讓她讀自己的狀態
[modules.world]
# guilds = []                    # 只看這些伺服器;空的 = bot 所在的每個伺服器(各伺服器的資料只在該伺服器用)
