# tick_secs = 30                 # 背景多久找一次結束了的段落
# compaction_wait_ms = 20000     # 壓縮逐字稿前最多等段落整理這麼久;等不到就先壓縮,記一筆,背景之後補
# retry_secs = 60                # 整理失敗後等多久再試,每失敗一次加倍
# retry_max_secs = 3600          # 最多等這麼久
# abandon_limit = 3              # 回覆連續這麼多次不能用,就跳過那一段
# per_tick = 4                   # 每個對話每次最多整理幾段
# 回想(recall)和每回合的記憶讀筆記時的門檻,讓「其實沒有答案」的問題少帶出不相關的行
# [modules.memory.notes_recall]
# min_score = 0.3                # 分數低於這個的行不回傳
# vector_alone_margin = 0.1      # 沒有共同的字、只靠意思像的行,cosine 要到 min_vector 再加這麼多
# gap_rank = 5                   # 第一名和第幾名比(不到這麼多行就和 min_score 比)
