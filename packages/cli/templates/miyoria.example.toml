# 長期記憶的新鮮度:回想時只放真的相關的事,舊的、現在式的、一直重複的會被淘汰。
# [modules.memory]
# min_score = 0.25               # 低於這個分數不回想(原本 0.05,幾乎什麼都放)
# min_vector = 0.5               # 沒有共同的字時,向量至少這麼像(cosine)才算相關,也是向量分數從 0 起算的地方。
#                                # 依模型:Harrier 270M 0.5、Harrier 0.6B 和 bge-m3 0.55、Qwen3 0.45、e5-small 約 0.85
# notes_vector_wait_ms = 500     # 開了 embedding 時,找筆記本最多等這句的向量這麼久,等不到就只用關鍵字(晚到的留給下一次)
# notes_vector_voice_wait_ms = 150 # 語音回合等的時間;要比 [modules.agent.voice] live_context_ms(400)短很多
# episode_recency_tau_days = 1.5 # 事件記憶(episode)的新近度衰減:小時到幾天,不是幾週
# state_note_hours = 12          # 「已經開台」「正在下載」這類現在式的筆記多久後失效(0 = 不失效)
# followup_max_age_hours = 6     # 追問過了時間這麼久沒人提就自動關掉;先挑最新的(0 = 不自動關)
# followup_repeat_hours = 24    # 同一個人、同一件事的追問,問過或答過這麼久內不再記一條新的(0 = 只看還沒問的)
# [modules.memory.repeat]        # 同一個梗在最近回想的 window 則裡出現超過 allowed 次就降權
# window = 40
# allowed = 3
# penalty = 0.15                 # 每多一次扣這麼多比例的分數
# floor = 0.4                    # 最低乘到這麼多
# similarity = 0.6               # 兩則記憶共同的字佔較小那組的比例到這裡才算同一件事

# 段落整理:`miyoria memory rebuild --apply` 整個跑完之後(下次啟動起),她的記憶由它即時寫進筆記,
# 下面「回想與整理」的 consolidate_* 那套停掉;回想和每回合的記憶改讀筆記。模型用途是 purpose。
# [modules.memory.segment]
# enabled = true
# idle_secs = 300                # 一段對話安靜這麼久就算結束,交給段落整理
