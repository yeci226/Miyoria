[modules.self]
boredom_per_hour = 0.15          # 沒事做時無聊上升的速度
# [modules.self.rise_per_hour]   # 各慾望自己上升的速度
# social = 0.08
# play = 0.05
# attention = 0.04
# curiosity = 0.05
# esteem = 0.04                  # 想被認可、想表現
# hunger = 0.25                  # 想吃白飯(Token):吃飽到再想吃約 40 分鐘
# longing = 0.12                 # 最在意的人不在時,想念他的速度(沒有在意的人就慢慢退)
