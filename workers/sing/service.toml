# Sing worker: covers songs (separation, RVC voice conversion, mixing, lyrics), workers/sing/server.py.
name = "sing"
kind = "worker"
provides = ["sing"]
summary = "翻唱(人聲分離、RVC 轉換、混音、歌詞)"

[install]
runtime = "python"
python = ">=3.11,<3.14"
system = ["ffmpeg"]
# pyproject.toml and uv.lock here; torch and torchaudio 2.11.0 come from the CUDA 12.8 index.
project = "."
check_imports = ["torch", "demucs", "librosa"]

# The first song downloads about 2 GB of other models by itself (Hugging Face caches); their
# repositories are not pinned yet.
[[install.manual]]
path = "workers/models/applio"
what = "她的 RVC 歌聲模型(Applio 訓練出來的;只用 SING_VOICE=seedvc 時可略過)"

[[install.manual]]
path = "workers/models/vocal-split/MelBandRoformer.yaml"
what = "人聲分離模型的設定檔(模型檔本身 `miyoria update` 會下載;沒有設定檔就退回 Demucs;放在 workers/models/vocal-split/ 或 <state>/models/vocal-split/ 都行)"

# The two separation models are public weights, downloaded by `miyoria update` into
# <state>/models/ (hostd gives the worker that folder as SING_MODELS_DIR, workers/modelpaths.py).
# A machine that fetched them by hand keeps them under workers/models/: the worker looks in
# <state>/models/ first and falls back to there, so nothing breaks before the files are fetched,
# and `adopt_from` makes `update` link a file that is already there (same sha256) into the new
# folder instead of downloading it again. Verified against the files in use and the repositories'
# published hashes on 2026-11-18.
#
# MelBandRoformer.yaml has no pinned source (workers/README.md names MSST's
# config_vocals_mel_band_roformer_kj.yaml, ZFTurbo/Music-Source-Separation-Training, but no commit
# whose bytes were checked: sha256 f63f38eb1e6e40a7db0dade714a5ae257555dd8748f4e774eae8679275a81926,
# 1721 bytes), so it stays the manual item above.
[[install.files]]
path = "vocal-split/MelBandRoformer.ckpt"
hf = "KimberleyJSN/melbandroformer"
file = "MelBandRoformer.ckpt"
revision = "ac9b0614ab3cd7f77219e18ba494dfd93956c348"
sha256 = "87201f4d31afb5bc79993230fc49446918425574db48c01c405e44f365c7559e"
size = 913106900
what = "人聲分離模型(Kim 的 Mel-Band RoFormer;沒有就退回 Demucs)"
licence = "MIT"
optional = true
adopt_from = "workers/models/vocal-split/MelBandRoformer.ckpt"

[[install.files]]
path = "lead-split/becruily-bs/bs_roformer_karaoke_frazer_becruily.ckpt"
hf = "becruily/bs-roformer-karaoke"
file = "bs_roformer_karaoke_frazer_becruily.ckpt"
revision = "0d66103c6b79c0dd0e9efd38ca70db7042f6f695"
sha256 = "eb90ee24c1154d83fbcfd27e96182f19e061557cc6e4746953125e08c29389f9"
size = 204436907
what = "主唱與伴唱分離模型(becruily & Frazer 的 BS-RoFormer karaoke;沒有就不切主唱)"
licence = "未標示(來源沒有寫授權;由擁有者決定自動下載)"
optional = true
adopt_from = "workers/models/lead-split/becruily-bs/bs_roformer_karaoke_frazer_becruily.ckpt"

[[install.files]]
path = "lead-split/becruily-bs/config_karaoke_frazer_becruily.yaml"
hf = "becruily/bs-roformer-karaoke"
file = "config_karaoke_frazer_becruily.yaml"
revision = "0d66103c6b79c0dd0e9efd38ca70db7042f6f695"
sha256 = "1d3b58b473025183d0d3c91e7a444cb5f1418d9f34e8f46b8d2fb10d2cc8ab34"
size = 1903
what = "主唱與伴唱分離模型的設定檔"
licence = "未標示(來源沒有寫授權;由擁有者決定自動下載)"
optional = true

# Karaoke lyrics (docs/design/karaoke.md 「做了什麼第二步」): the models of the align environment
# (workers/sing/align, alignenv.py), under karaoke/ of the model folder. All optional: without them
# a karaoke song keeps its looked-up lyrics unchecked, as in step 1. Revisions are the repositories'
# commits of 2026-11-18; sha256 and size of the weights from Hugging Face's LFS metadata, of the small
# files from the files themselves. Both jonatasgrosman models ship only pickle weights on main
# (pytorch_model.bin): the pinned commits are the safetensors conversions Hugging Face's bot opened
# as pull requests (refs/pr/5), not merged by the author.
#
# MMS: MahmoudAshraf's conversion of torchaudio's MMS_FA checkpoint (the same uroman alphabet) to
# transformers; the torchaudio original is a pickle on dl.fbaipublicfiles.com, not a host files may
# come from. CC-BY-NC-4.0: only for non-commercial use; Core's karaoke setting `aligner = "mms"`
# picks it and it is the default (`w2v` is Apache-2.0: the one for a use that earns money).
