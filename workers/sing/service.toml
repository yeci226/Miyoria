[run]
command = ["{python}", "server.py"]
cwd = "."
port = 8005
host_env = "HOST"
port_env = "PORT"
# It starts after asr and tts. Who shares the card is host.toml's [gpu] arbiter:
# - "worker" (the default): it gets their addresses as SING_OFFLOAD_URLS ({offload_urls}: this
#   host's evictable services, tts then asr; left out when there are none) and decides by itself.
# - "hostd": hostd decides; it starts the worker with SING_GPU_ARBITER=hostd and without
#   SING_OFFLOAD_URLS, and reads the SING_* tuning below and in host.toml from here.
after = ["asr", "tts"]
env = { SING_OFFLOAD_URLS = "{offload_urls}", SING_MODELS_DIR = "{models}" }

[run.health]
http = "/health"

# The worker has no offload endpoint of its own: it holds the card by the job and asks others
# to make room.
[gpu]
policy = "on_demand"
vram_mb = { resident = 7500, peak = 7500 }
