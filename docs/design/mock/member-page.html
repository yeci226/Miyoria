<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員頁示意圖</title>
<style>
  /* Tokens copied from apps/panel/src/index.css (櫻花). */
  :root {
    --background: #0b0d12; --foreground: #f1f0f4; --muted-foreground: #dedce4;
    --muted: rgba(255,255,255,.1); --border: rgba(255,255,255,.11);
    --primary: #f29dc4; --secondary: #7355e8;
  }
  * { box-sizing: border-box; }
  html { background: var(--background); }
  body { margin: 0; color: var(--foreground); font: 14px/1.5 "Geist Variable", Geist, "PingFang TC", "Microsoft JhengHei UI", "Noto Sans TC", system-ui, sans-serif;
    background: linear-gradient(160deg, #4a4350 0%, #2c3140 45%, #1b1e28 100%) fixed; min-height: 100vh; }
  ::selection { background: color-mix(in oklab, var(--primary) 45%, transparent); }
  .wrap { display: flex; flex-wrap: wrap; gap: 28px; padding: 20px; justify-content: center; }
  .phone { width: 390px; max-width: 100%; background: rgba(9,10,16,.38); }
  .cap { font-size: 12px; color: var(--muted-foreground); padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .page { padding: 20px 16px 28px; display: grid; gap: 22px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .who { display: flex; gap: 14px; align-items: center; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #e9c9d6, #b9a1c9); flex: none; }
  .who b { display: block; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .who span { color: var(--muted-foreground); margin-right: 12px; }
  .who span i { font-style: normal; color: var(--foreground); font-weight: 500; }
  .band { display: grid; gap: 8px; }
  .band .top { display: flex; justify-content: space-between; align-items: baseline; }
  .band .top span { color: var(--muted-foreground); font-size: 13px; }
  .band .top b { font-weight: 500; font-size: 15px; }
  .steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .steps i { height: 5px; border-radius: 2px; background: var(--muted); }
  .steps i.on { background: var(--primary); }
  blockquote { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid color-mix(in oklab, var(--primary) 70%, transparent); font-size: 15px; }
  .bond { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; align-items: center; }
  .bond svg { width: 84px; height: 84px; display: block; }
  .bond .top { display: flex; justify-content: space-between; align-items: baseline; }
  .bond .top span { color: var(--muted-foreground); font-size: 13px; }
  .bond .top b { font-weight: 500; font-size: 15px; }
  .bond p { margin: 6px 0 0; font-size: 13px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="cap">現在</div>
    <div class="page">
      <div class="who"><div class="avatar"></div><div><b>owen0924</b><span>她叫你 <i>Owen</i></span><span>關係 <i>朋友</i></span></div></div>
      <div class="band"><div class="top"><span>羈絆</span><b>不錯</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></div>
      <div class="band"><div class="top"><span>信任</span><b>很信任</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <div class="band"><div class="top"><span>熟悉</span><b>很熟</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <blockquote>PR #59、#60 那句「some day」我記著了,你別讓我等到忘記。</blockquote>
    </div>
  </div>

  <div class="phone">
    <div class="cap">加上環之後(羈絆 28,第 1 圈)</div>
    <div class="page">
      <div class="who"><div class="avatar"></div><div><b>owen0924</b><span>她叫你 <i>Owen</i></span><span>關係 <i>朋友</i></span></div></div>
      <div class="bond"><div data-ring="28"></div><div><div class="top"><span>羈絆</span><b>朋友 II</b></div><p>離「朋友 III」還有一段</p></div></div>
      <div class="band"><div class="top"><span>信任</span><b>很信任</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <div class="band"><div class="top"><span>熟悉</span><b>很熟</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <blockquote>PR #59、#60 那句「some day」我記著了,你別讓我等到忘記。</blockquote>
    </div>
  </div>

  <div class="phone">
    <div class="cap">很久以後(羈絆 342,第 4 圈)</div>
    <div class="page">
      <div class="who"><div class="avatar"></div><div><b>owen0924</b><span>她叫你 <i>Owen</i></span><span>關係 <i>心有靈犀</i></span></div></div>
      <div class="bond"><div data-ring="342"></div><div><div class="top"><span>羈絆</span><b>心有靈犀 II</b></div><p>離「心有靈犀 III」不遠了</p></div></div>
      <div class="band"><div class="top"><span>信任</span><b>很信任</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <div class="band"><div class="top"><span>熟悉</span><b>很熟</b></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
      <blockquote>我還沒說你就知道了……不准偷看我在想什麼!</blockquote>
    </div>
  </div>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const HEART = "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z";
function el(name, attrs, parent) { const n = document.createElementNS(NS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
// The public ring: the lap being filled, ten segments round it, a plain white heart (no number).
function ring(bond) {
  const svg = el("svg", { viewBox: "0 0 160 160", role: "img", "aria-label": "羈絆環" });
  const laps = Math.min(Math.floor(bond / 100), 10), frac = bond >= 1000 ? 1 : (bond % 100) / 100;
  const RO = 75, CO = 2 * Math.PI * RO, SEG = CO / 10, GAP = 5;
  for (let i = 0; i < 10; i++) {
    const n = el("circle", { cx: 80, cy: 80, r: RO, fill: "none", "stroke-width": 4, "stroke-linecap": "round",
      "stroke-dasharray": (SEG - GAP - 4) + " " + CO, transform: "rotate(" + (-90 + i * 36 + ((GAP / 2 + 2) / CO) * 360) + " 80 80)" }, svg);
    n.style.stroke = i < laps ? "var(--primary)" : "rgba(255,255,255,.14)";
  }
  el("circle", { cx: 80, cy: 80, r: 58, fill: "none", stroke: "rgba(255,255,255,.07)", "stroke-width": 14 }, svg);
  const c = 2 * Math.PI * 58, cap = 7;
  const a = el("circle", { cx: 80, cy: 80, r: 58, fill: "none", "stroke-width": 14, "stroke-linecap": "round",
    "stroke-dasharray": Math.max(c * frac - cap * 2, 0.01) + " " + c, transform: "rotate(" + (-90 + (cap / c) * 360) + " 80 80)" }, svg);
  a.style.stroke = "var(--primary)";
  const g = el("g", { transform: "translate(80 81) scale(2.5) translate(-12 -12)" }, svg);
  const h = el("path", { d: HEART, "stroke-width": 1.6, "stroke-linejoin": "round" }, g);
  h.style.fill = "var(--foreground)"; h.style.stroke = "var(--foreground)";
  return svg;
}
for (const n of document.querySelectorAll("[data-ring]")) n.appendChild(ring(Number(n.dataset.ring)));
</script>
</body>
</html>
