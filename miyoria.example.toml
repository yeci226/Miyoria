# max_calls_per_day = 400
# min_interval_secs = 30         # 同一個頻道兩次整理至少隔多久
# stale_thread_mins = 30         # 筆記裡這麼久沒人碰的事(懸而未決的問題、話題)不再放進 prompt

# 她自己整理的資料庫(人、伺服器、她自己、她取名的主題):內容結構由她決定,這裡只有大小上限
