# Miyoria 設定檔。複製成 miyoria.toml,或執行 `npx miyoria init`;之後用 `miyoria config` 修改。
# 字串可以用 ${ENV_VAR} 或 ${ENV_VAR:-預設值} 引用環境變數 / .env。

[core]
profile = "deepseek-chan"          # profiles/<id>/
profiles_dir = "profiles"
database_url = "${DATABASE_URL:-sqlite:data/miyoria.db}"
log = "info,miyoria=debug"

# ---- LLM ----------------------------------------------------------------
# 任何 OpenAI 相容 API 都可以:填 base_url、api_key,模型 id 在 purposes 裡。
[llm.providers.deepseek]
kind = "deepseek"                  # deepseek | openai | openai-compatible
base_url = "${LLM_BASE_URL:-https://api.deepseek.com}"
api_key = "${LLM_API_KEY:-}"

# 全域預設;profile.toml 的 [llm.purposes] 會覆寫
[llm.purposes]
chat = ["deepseek:deepseek-chat"]
# 高風險動作的自我審核;不設就用 chat 的模型(啟動後第一次審核會記一行警告)
review = ["deepseek:deepseek-chat"]
# 她的內心獨白(心智迴圈);不設就用 chat 的模型(會記一行警告)
mind = ["deepseek:deepseek-chat"]

# 推理模型要不要先思考,依用途(沒列的 = 不思考)。不急的判斷開、要即時的關:
# 文字回覆會思考、語音回覆一律不思考(agent 每次自己決定,不看這裡的 chat)
[llm.thinking]
chat = true          # 文字聊天回覆
review = true        # 高風險動作的自我審核
mind = true          # 她的內心獨白(心智迴圈)
summarizer = true    # 記憶整理
fast = false         # 要不要插話的快速判斷(語音裡一律不思考)

# 看圖:聊天模型支援圖片時,她直接用它看圖(deepseek-v4.1-flash 可以)。
# 不收圖片的模型或 provider 標 false(沒列的 = 收);被 API 拒絕時也會自動改送文字並記住
# [llm.image_input]
# "ollama" = false
# "opencode:some-text-model" = false

# 價格(USD / 百萬 token)與預算;不設就不限制
# [llm.pricing."deepseek:deepseek-chat"]
# input_per_mtok = 0.27
# cached_input_per_mtok = 0.07
# output_per_mtok = 1.10
# [llm.budget]
# daily_usd = 2.0
# monthly_usd = 40.0
# degrade_at = 0.8           # 用到 80% 時改用便宜模型 / 少主動發話
# on_exhausted = "stop"

# ---- 長期記憶 --------------------------------------------------------------
# DeepSeek 沒有 embeddings;不設也能用(全文檢索 + 新舊 + 重要度)。
# 有 Ollama / LM Studio / OpenAI 等 /embeddings 端點時可以打開:
# [memory.embedding]
# provider = "openai-compatible"
# base_url = "http://127.0.0.1:11434/v1"
# model = "bge-m3"

# ---- MCP 工具 --------------------------------------------------------------
# [mcp.servers.files]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/data"]
# tools_allow = ["read_*"]

# ---- 語音辨識 / 合成 -------------------------------------------------------
# 本機 worker 見 workers/README.md;也可以換成雲端(kind = "openai")
[speech.asr.local]
kind = "http-worker"
url = "${ASR_URL:-http://127.0.0.1:8001}"

# workers/tts 預設用 faster-qwen3-tts(原生 Windows、真串流)
# 另一個選項:WSL2 / Docker 上的 vLLM-Omni(見 workers/README.md 第 3 節)
# [speech.tts.qwen]
# kind = "vllm-omni"
# base_url = "http://127.0.0.1:8091/v1"
# voice = "deepseek-chan"
# language = "Chinese"

[speech.tts.local]
kind = "http-worker"
url = "${TTS_URL:-http://127.0.0.1:8002}"
voice = "deepseek-chan"

# ---- 子系統 --------------------------------------------------------------
# 每個 [modules.<id>] 都可以加 enabled = false 關掉

# 擁有者只在這裡設定(舊設定檔的 [modules.auth] owners 仍然有效,兩邊會合併)
[modules.commands]
owners = ["discord:${MIYORIA_OWNER_ID:-0}"]

# 角色與權限節點(owner > admin > moderator > trusted > user > restricted > blocked)
[modules.auth]
# default_role = "user"

[modules."platform.discord.bot"]
token = "${DISCORD_BOT_TOKEN:-}"
# 填伺服器 id 可以讓 slash command 立即生效;空的 = 全域(最多要等一小時)
# id 要加引號,例如 ["123456789012345678"](數字太大,TOML 整數會失真)
# 每次啟動會清掉另一種範圍留下的舊指令;指令清單有重複時可執行一次
# `miyoria discord commands reset`
command_guilds = []
# 讓她知道誰在線、在玩什麼、誰在哪個語音頻道。要先在 Developer Portal → Bot →
# Privileged Gateway Intents 打開 Presence Intent 與 Server Members Intent;
# 沒開就設成 false,否則 Discord 會拒絕連線
presence_intents = true

# Admin API:CLI(`miyoria module ...`)和之後的管理面板用。token 由 `miyoria init` 產生
[modules.api]
bind = "127.0.0.1:7878"
token = "${MIYORIA_API_TOKEN:-}"
# Prometheus 指標在 GET /metrics,預設跟 /api 一樣要 Authorization: Bearer <token>
# (Prometheus 用 authorization.credentials 帶 token)。設成 true 就不用驗證,
# 但連得到 bind 位址(或前面的反向代理)的人都看得到。
# metrics_public = false

# 管理面板用 Discord 登入(token 照樣能用)。三個值都填才會開啟;
# redirect_uri 要跟 Developer Portal → OAuth2 → Redirects 裡的一模一樣,
# 也要跟你在瀏覽器開面板的網址同源(見 docs/OPERATIONS.md)。
# 擁有者與 admin 角色可以登入;其他角色要 `/admin perm allow` 給 admin.panel.access(唯讀)
# 與 admin.panel.write(可修改)。
# [modules.api.discord_oauth]
# client_id = "${DISCORD_CLIENT_ID:-}"
# client_secret = "${DISCORD_CLIENT_SECRET:-}"
# redirect_uri = "http://127.0.0.1:7878/api/auth/oauth/callback"
# session_days = 7
# cookie_secure = true             # 預設:redirect_uri 是 https 就開

# Self 帳號語音節點(apps/voice-node)連進來的位址;token 由 `miyoria init` 產生
[modules."voice.link"]
bind = "127.0.0.1:7879"
token = "${VOICE_LINK_TOKEN:-}"

# Stage 節點(VTube Studio / OBS / overlay)連進來的位址
[modules."stage.link"]
bind = "127.0.0.1:7882"
token = "${STAGE_LINK_TOKEN:-}"

# OBS 智慧場景:每個場景的用途(chat 聊天 / game 遊戲 / brb 暫離 / starting 開場 / ending 結尾 / sing 唱歌)。
# 第一次看到 OBS 的場景清單時用 fast 模型從名稱判斷(沒有模型就用關鍵字),面板「直播」頁可以改;
# 這裡寫的最優先,面板不能改。導演:開台 → 開場再到聊天、開始玩遊戲 → 遊戲、直播中沒人講話或她離開語音
# → 暫離、下播 → 結尾(先停留 ending_ms 再真的停播)、唱歌 → 唱歌(放原曲 MV,唱完回到原本的場景)。
# 她也可以自己用 stage_scene 換。
[modules."stage.link".scenes]
# director = true
# roles = { chat = "聊天", game = "遊戲", brb = "暫離", starting = "開場", ending = "結尾", sing = "唱歌" }
# transition = { name = "Fade", duration_ms = 300 }   # 每次切換用的轉場(OBS 裡的名稱)
# transitions = { game = { name = "Stinger" } }       # 個別用途的轉場(stinger 不用給長度)
# starting_ms = 30000        # 開場畫面停多久
# ending_ms = 6000           # 停播前結尾畫面停多久
# brb_after_ms = 300000      # 直播中多久沒人講話就切暫離(0 = 不切)
# manual_hold_ms = 120000    # 有人手動切場景後,導演多久不插手
# min_switch_ms = 8000       # 兩次自動切換至少隔多久

# 擴充套件資料夾(`miyoria ext list` / `miyoria ext dev`)。子資料夾 examples/ 不會載入;
# 想試範例(/hello)就把 "extensions/examples" 加進來
[modules.extensions]
dirs = ["extensions"]
# 擴充只拿到白名單內的環境變數(PATH、TEMP、HOME…加上 manifest [env] pass 列的),拿不到這裡的密鑰。
# 要多給一個擴充變數:
# [extensions."miyoria.minecraft"]
# env = { MIYORIA_MC_TOKEN = "${MC_TOKEN:-}" }   # 直接設定值
# env_pass = ["MIYORIA_MC_*"]                    # 取代 manifest 的 [env] pass
# minecraft_dir = 'C:\Users\<你>\AppData\Roaming\PrismLauncher\instances\<實例>\.minecraft'
# 她要玩時自己用 Prism Launcher 開遊戲(實例 id 從 minecraft_dir 推,Prism 執行檔自動找)
# prism_path = 'C:\Users\<你>\AppData\Local\Programs\PrismLauncher\prismlauncher.exe'
# launch_world = "latest"      # 直接進最近玩的存檔;"" = 停在主選單
# quit_on_stop = "launched"    # 停止玩時只關她自己開的遊戲(always / never)

# 遊戲(導演迴路)。`game start` 會先確認遊戲開著、模組連上了;沒開就請 adapter 自己開
# (auto_launch),開不起來才拒絕並說原因。動作失敗後一陣子不給 goto / mine,逼她換方法
# [modules.game]
# default_game = "minecraft"
# require_connected = true
# auto_launch = true
# launch_wait_secs = 240
# failure_guard_secs = 45

# 唱歌(點歌):歌曲 worker(workers/sing,見 workers/README.md 第 9 節)用她的聲音翻唱。
# 有人點歌她自己決定要不要唱、什麼時候唱;/queue song request 是強制(好了、她有空就唱)。
# 唱的時候插話不會打斷,/queue song skip | stop 才會。Go Live 要讓觀眾聽到歌,voice node 要 GOLIVE_AUDIO=true
# [modules.sing]
# url = "http://127.0.0.1:8005"
# start = "decide"           # decide:準備好了她挑時機唱;auto:好了就唱
# max_pending_per_user = 2   # 每個人同時最多幾首在歌單上
# lyrics = true              # 同步歌詞變成 overlay 字幕
# lyrics_card = false        # 唱有歌詞的歌時放一張歌詞卡(只顯示當下這一句),放在她在該伺服器最後打字的頻道,沒打過字就放語音頻道的文字聊天
# lip_sync_vocals = true     # 嘴型跟轉換後的人聲走(不是整首混音)
# vote_skip_ratio = 0.25     # /queue song voteskip:語音裡這個比例的人投了就跳過(無條件進位)
# vote_skip_min = 1          # 至少幾票;點歌的人自己投一票就跳過
# video = true               # 唱的時候在直播畫面放原曲影片(靜音);Stage 用 [stage.obs] song_video_source 播
# video_dir = "data/songs"   # worker 的 SING_DATA_DIR(直播機上的路徑),不在裡面的影片不會送
# prepare_notice = true      # worker 做歌要整張顯示卡時(SING_OFFLOAD_URLS),她先說「我去準備一下歌喔」再讓它開始
# prepare_notice_gap_secs = 180   # 連點好幾首時這段時間內不再說第二次

# 她閒著時自己滑 Threads,把截圖和評語發到文字頻道(要有 extensions/threads,見它的 README)。
# 只有貼文對得上那個頻道的記憶和筆記才發;上限、頻道、時段都由程式把關,模型繞不過去。
# [modules.share]
# enabled = true
# when = "anytime"           # anytime:想發就發;active:等頻道有人聊天才發
# max_per_day = 3            # 一天最多發幾則
# min_gap_mins = 120         # 兩則至少隔多久
# browse_per_day = 6         # 一天最多滑幾輪
# browse_gap_mins = 120      # 兩輪至少隔多久
# posts = 10                 # 一輪最多看幾則(有圖的每則看一次圖;沒設看圖模型就跳過有圖的貼文)
# quiet_hours = "01:00-08:00"   # 這段時間不滑也不發,空字串 = 關閉
# channels = []              # 頻道 id;空 = 她自己挑
# exclude = []               # 永遠不發的頻道 id
# keep_hours = 24            # active 模式下貼文最多等多久

# 遊戲內聊天變成獨立的對話(每個世界 / 伺服器一段歷史)。玩家在 Discord 用 /me link 拿代碼,
# 在遊戲聊天室打 `!link <代碼>` 就跟 Discord 帳號連在一起;沒連的玩家是陌生人。
# 她在遊戲裡的回話很短、不會下指令;直播中又在語音裡時也用語音說(她可以用 game_chat_reply 自己改)
[modules."game.chat"]
# games = ["minecraft"]
# world = "local"            # 這個世界 / 伺服器的名字(對話情境的 scope;頻道模式可用 "minecraft:local")
# username = ""              # 她在遊戲裡的名字(別人提到時才知道是在叫她)
# max_chars = 120            # 她在遊戲聊天室一句最多幾個字
# reply = "auto"             # auto | chat | voice | both

[modules.voice]
consent = "opt-out"        # opt-out:預設收音,可用 /voice consent off 退出;opt-in:同意後才收
barge_in = "stop"          # 有人插話時停止說話:stop | ignore
# 說話用另一種語言(例如日文聲線比較好聽):每句先用 LLM(fast)翻譯再送 TTS,字幕和聊天紀錄維持原文
# tts_translate = "Japanese"
# Discord Go Live:voice node 的 ffmpeg 在這裡等 OBS 推流(對應 OBS 的伺服器 + 金鑰)。
# 預設 = OBS 伺服器 rtmp://127.0.0.1:1935/live、金鑰 miyoria。`/voice golive start` 會用它
# (她還不在語音裡時,會先進你所在的語音頻道)。
# golive_source = "rtmp://127.0.0.1:1935/live/miyoria"

# 她的行動閘門:進語音、開台、換場景、玩遊戲、私訊……不論誰要求都要過這裡(紀錄在稽核紀錄)。
# 緊急暫停用 /admin autonomy pause;每個人可以用 /me privacy 拒絕私訊或被主動找
[modules.actions]
# forbidden = ["message.dm"]     # 完全禁止的能力(也可以 "stream.*")
# dm_strangers = false           # 不私訊不熟的人(熟悉度低於 stranger_familiarity)
# [modules.actions.medium]       # 中風險動作的次數上限(她自己決定或聊天請求時;指令不受限)
# per_day = 30
# per_person_per_day = 8
# cooldown_ms = 20000
# inline_wait_ms = 8000          # 高風險工具(跑程式等)等審核多久;來不及就晚點在後續回合告訴她結果
# [modules.actions.limits."code.run"]
# per_day = 50
# cooldown_ms = 5000

[modules.agent]
# 文字頻道的聊天等級:off(關閉)| mention-only(只回提及)| quiet(安靜)| normal(一般)| lively(活躍)
# (always = 每則都回,測試用;舊的 ambient = normal)。等級是上限:她在等級之內自己決定要多話,
# 有人請她安靜點她也會自己調。沒設定的頻道用 profile 的 default_channel_mode(預設 quiet)。
# 也可以在 Discord 用 /channel mode 或面板「內心 → 世界」即時切換
# default_mode = "quiet"
# channels = { "<channel id>" = "lively", "discord:<guild id>" = "mention-only" }
# 對話紀錄:最多幾個字進 prompt(舊的先丟)、單則上限;她寫 @名字 會變成真的 tag
# max_prompt_chars = 16000
# max_entry_chars = 2000
# mention_users = true

# 語音聊天:比文字更保守,偶爾才插話。也可以用 /voice mode 即時切換
# 她自己定了多話程度(心智迴圈或「活躍點」)的地方,插話機率、冷卻與門檻都照她的;
# 下面的倍率只在她沒定的時候用。min_cooldown_ms 是不管她多想講都不能更快的底線
[modules.agent.voice]
default_mode = "normal"    # off | mention-only | normal | always(語音沒有安靜 / 活躍之分)
ambient_factor = 0.5       # 主動插話機率的倍率(她沒定多話程度時)
cooldown_ms = 20000        # 她講完後至少隔多久才會再主動開口
min_cooldown_ms = 5000     # 她定了多話程度時,冷卻的底線
debounce_ms = 700          # 對方講完後等多久(看他是不是還要繼續講)
text_chat = true           # 她在語音頻道裡時,那個頻道文字區打的字她也用說的回
text_aside = true          # 用說的回時,網址和程式碼改貼到語音頻道的文字區

# 她沒親眼看到的上下文:重開後(或很久沒人講話後)補抓頻道之前的訊息、回覆鏈。
# 需要 Bot 的「讀取訊息歷史」權限;抓不到就用自己的訊息紀錄
[modules.agent.history]
backfill = 20              # 冷啟動補抓幾則(0 = 不補抓)
reply_chain = 3            # 回覆的訊息不在紀錄裡時,最多往上抓幾則
timeout_ms = 3000          # 最多等多久,逾時就不等了直接回

# 看圖(聊天模型要收圖片,見 [llm.image_input]):她回的訊息、它回覆的訊息、
# 同一個人兩分鐘內傳的圖
[modules.agent.vision]
enabled = true
max_images = 3             # 每回合最多幾張
max_image_bytes = 5000000  # 單張上限
# detail = "auto"          # auto | low | high(low 最便宜)

# 她的感知:誰在線、在玩什麼、誰在哪個語音頻道、各頻道熱不熱鬧。
# 每個人都能用 /me privacy presence:off 不讓她讀自己的狀態
[modules.world]
# guilds = []                    # 只看這些伺服器;空的 = bot 所在的每個伺服器(各伺服器的資料只在該伺服器用)
care_min_affinity = 30           # 好感或熟悉度到這個程度,對方上線 / 進語音時她才會注意到
care_min_familiarity = 40
# game_interests = ["Minecraft"] # 除了角色的 interests 之外,她有興趣的遊戲
cooldown_secs = 900              # 同一件事(同一個人上線…)多久內不再提醒她
max_salient_per_minute = 6
# voice_activity_window_secs = 300 # 語音裡的對話(語音辨識的句子)算在多長的時間內
# voice_lively_lines = 6         # 這段時間內這麼多句,或 voice_quiet_secs 內有人說話 = 正在聊天(不是冷場)
# voice_quiet_secs = 40

# 她的內在:慾望(想聊天、想玩、想被注意、想休息、好奇)、無聊、她自己定的方針與議程、
# 對每個人的感情描述。數字只決定自然漂移的速度,怎麼做由她自己判斷
[modules.self]
boredom_per_hour = 0.15          # 沒事做時無聊上升的速度
# [modules.self.rise_per_hour]   # 各慾望自己上升的速度
# social = 0.08
# play = 0.05
# attention = 0.04
# curiosity = 0.05
# esteem = 0.04                  # 想被認可、想表現
# hunger = 0.05                  # 想吃白飯(Token)
# longing = 0.12                 # 暗戀的人不在時,想念他的速度(沒有暗戀對象就慢慢退)
# [modules.self.emotions]        # 她的情緒(七情);各情緒來得多快、退得多快是 profile 的 [temperament]
# notice = 0.2                   # 超過這個才算明顯:放進 prompt、決定她表現出來的樣子
# prompt_max = 3                 # prompt 最多列幾種情緒
# missing_after_hours = 20       # 在乎的人多久沒出現開始想念
# jealousy_lines = 3             # 在乎的人在 jealousy_window_mins 內回覆別人幾次、都沒理她就吃醋
# jealousy_window_mins = 15
# [modules.self.heart]           # 心動與暗戀:只從她喜歡的人的互動自己長出來,沒有人能設定
# min_affinity = 25              # 好感至少這麼多才會心動
# daily_gain = 0.06              # 每人每天最多長這麼多
# crush_threshold = 0.35         # 心動最高、而且超過這個的人就是她暗戀的人(可能沒有)
# crush_margin = 0.08            # 別人要多這麼多才會換人

# 她的心智迴圈:有事發生(有人上線 / 進語音、頻道冷掉、語音冷場、她剛講完話)或心跳時,
# 她自己想一想:寫內心獨白、調整感受與方針、決定要不要主動做事(每件事都要過行動閘門)。
# 想法時間軸在面板「內心 → 想法」;/admin autonomy pause 會讓她停止思考。
# 這裡只有成本與頻率的上限,怎麼想、做什麼是她自己決定
[modules.mind]
max_calls_per_hour = 12          # 一小時最多想幾次(心跳會依狀況自己放慢 / 加快)
min_interval_secs = 45           # 兩次之間至少隔多久
# max_heartbeat_mins = 30        # 心跳最慢多久一次
# max_intents = 2                # 一次想法最多做幾件事
# quiet_start_hour = 1           # 深夜安靜時段:心跳變慢,只因心跳醒來時不主動找人
# quiet_end_hour = 7
# voice_quiet_secs = 40          # 語音裡聊完後安靜多久算冷場
# self_start_gap_voice_secs = 300 # 同一個語音頻道,她自己主動開口至少隔多久
# self_start_gap_text_secs = 600 # 同一個文字頻道 / 私訊
# self_start_max_backoff = 8     # 主動開口沒人接,間隔每次加倍,最多到這麼多倍;有人跟她說話就恢復
# stale_topic_mins = 45          # 她提過、沒人接的話題,這段時間內不再提
# blocked_retry_mins = 30        # 失敗的動作(例如遊戲沒開時的 game.start)狀況沒變前不再試,最久這麼久
# journal_keep = 200             # 想法日誌保留幾則原文;再多 digest_batch 則就把最舊的整理成摘要
# digest_batch = 50
# digests_keep = 60              # 摘要保留幾則(在面板「內心 → 想法」)

# ---- 反思與學習(自主層階段 G)-------------------------------------------------

# 對話筆記:每個頻道 / 私訊 / 語音 / 遊戲聊天,每 fold_every_messages 句或停頓 fold_idle_secs
# 秒,她就把還沒整理的對話併進自己的筆記(用途 summarizer,在背景跑,不影響語音延遲)。
# prompt 放筆記 + 最近的原文,舊的對話被丟掉也不會忘記。
